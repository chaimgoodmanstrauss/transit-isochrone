<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Walking Isochrone</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  /* Look borrowed from Symmetry Stroller: light surfaces, indigo accent,
     EB Garamond title floating top-right with a soft white glow. */
  @font-face {
    font-family: 'EB Garamond'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('fonts/EBGaramond-600.woff2') format('woff2');
  }
  @font-face {
    font-family: 'EB Garamond'; font-style: italic; font-weight: 500; font-display: swap;
    src: url('fonts/EBGaramond-500-Italic.woff2') format('woff2');
  }
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --border: #e5e7eb; --border-strong: #d1d5db;
    --text: #16181d; --text-muted: #6b7280; --accent: #4f46e5; --accent-hover: #4338ca;
    --danger: #dc2626; --radius: 10px; --radius-sm: 7px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06); --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14.5px; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  #map { position: absolute; inset: 0; background: var(--bg); }

  #title {
    position: absolute; top: 20px; right: 20px; z-index: 1000; pointer-events: none;
    font-family: 'EB Garamond', 'Garamond', 'Georgia', serif;
    color: #4a1030; opacity: 0.92; text-align: right;
    text-shadow: 0 0 4px #fff, 0 0 12px #fff, 0 0 28px rgba(255,255,255,.9), 0 4px 36px rgba(255,255,255,.8);
  }
  #title span { width: fit-content; margin-left: auto; }   /* hover tip on the words only (hit-tested, so the map keeps its hand cursor and drags) */
  #title .title-main {
    display: block; font-weight: 600;
    font-size: clamp(28px, 4vw, 56px); line-height: 1.05; letter-spacing: 0.01em;
  }
  #title .title-sub {
    display: block; font-style: italic; font-weight: 500;
    font-size: clamp(26px, 3.8vw, 54px); margin-top: 0.15em; opacity: 0.85;
  }

  .panel {
    position: absolute; top: 12px; left: 56px; z-index: 1000; width: 270px; max-width: calc(100vw - 72px);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 38px 16px 14px; box-shadow: var(--shadow-md);
  }
  .panel.hidden { display: none; }
  /* no focus rectangle when clicking map shapes, pin or buttons */
  .leaflet-container :focus, .leaflet-container:focus, .leaflet-interactive:focus { outline: none; }
  #closePanel {
    position: absolute; top: 6px; left: 8px; width: 24px; height: 24px; padding: 0;
    border: 1.5px solid var(--border-strong); border-radius: 50%; background: var(--surface);
    color: var(--text-muted); font-size: 18px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  #closePanel:hover { background: var(--bg); color: var(--text); border-color: var(--text-muted); }
  .panel-toggle.hidden { display: none; }
  .panel-toggle a { display: grid !important; place-items: center; color: #000; }
  .panel-toggle svg { width: 16px; height: 16px; }
  .panel label { display: block; font-size: 13.5px; font-weight: 500; color: var(--text-muted); margin: 12px 0 4px; }
  .panel label.first { margin-top: 0; }

  .search { position: relative; }
  .search input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); font: inherit; box-shadow: var(--shadow-sm);
    transition: border-color .15s ease;
  }
  .search input:focus { outline: none; border-color: var(--accent); }
  #here {
    position: absolute; top: 6px; right: 16px;
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; transition: background-color .15s ease, color .15s ease;
  }
  #here:hover { background: var(--bg); color: var(--accent); }
  #here svg { width: 24px; height: 24px; }

  #searchResults { list-style: none; margin: 4px 0 0; padding: 0; max-height: 160px; overflow-y: auto; }
  #searchResults li { padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; }
  #searchResults li:hover { background: var(--bg); }

  .row { display: flex; gap: 10px; align-items: center; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row output { text-align: left; white-space: pre; font-variant-numeric: tabular-nums; font-weight: 500; }

  .status { font-size: 13.5px; margin-top: 10px; min-height: 18px; color: var(--text-muted); }
  .status:empty { display: none; }
  .status.err { color: var(--danger); }
  /* Light hover tips: appear after a short pause near the pointer, vanish on leave or press. */
  #tip {
    position: fixed; z-index: 2000; pointer-events: none; max-width: 250px;
    padding: 5px 9px; border: 1px solid var(--border); border-radius: 5px;
    background: rgba(255,255,255,.96); color: var(--text-muted); font-size: 14.5px; line-height: 1.35;
    box-shadow: var(--shadow-sm); opacity: 0; transition: opacity .12s ease;
  }
  #tip.on { opacity: 1; }
  /* touch screens: fingertip-sized panel buttons, keep the page itself from scrolling/zooming */
  html, body { overflow: hidden; overscroll-behavior: none; }
  @media (pointer: coarse) {
    .panel { padding-top: 50px; top: calc(12px + env(safe-area-inset-top)); }
    #closePanel, #here { width: 36px; height: 36px; }
    #closePanel { font-size: 24px; }
    #here svg { width: 28px; height: 28px; }
    #tip { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip" role="tooltip"></div>
<div id="title"><span class="title-main">Walking Isochrone</span><span class="title-sub">How far can you get?</span></div>

<div class="panel" id="panel">
  <button type="button" id="closePanel" aria-label="Hide controls">&times;</button>
  <button type="button" id="here" aria-label="Use my current location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>
    </svg>
  </button>
  <label for="q" class="first">from</label>
  <div class="search">
    <input type="text" id="q" placeholder="Address or landmark, then Enter" aria-label="Address or landmark">
  </div>
  <ul id="searchResults"></ul>

  <label for="mins">walking time</label>
  <div class="row" id="minsRow">
    <output id="minsOut"> 30 minutes</output>
    <input type="range" id="mins" min="5" max="120" step="5" value="30">
  </div>

  <div class="status" id="status"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const VALHALLA = "https://valhalla1.openstreetmap.de/isochrone";
const NOMINATIM = "https://nominatim.openstreetmap.org/search";
const NOMINATIM_REVERSE = "https://nominatim.openstreetmap.org/reverse";
// Public CARTO key shared with Symmetry Stroller (browser-visible by design).
const CARTO_API_KEY = "YOUR_CARTO_KEY";
// The public Valhalla server caps time contours at 60 min but allows
// distance contours further out, so bands are requested by distance at
// Valhalla's default pedestrian walking speed.
const WALK_KMH = 5.1;
const FRACTIONS = [1 / 3, 2 / 3, 1];
const BAND_COLORS = ["#4f46e5", "#7c3aed", "#db2777"];

const map = L.map("map", { zoomControl: false }).setView([40.7128, -74.006], 12);
// "Show controls" button sits below +/- in the same Leaflet bar style.
const PanelToggle = L.Control.extend({
  options: { position: "topleft" },
  onAdd() {
    const div = L.DomUtil.create("div", "leaflet-bar leaflet-control panel-toggle hidden");
    div.innerHTML = '<a href="#" role="button" aria-label="Show controls">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
      '<path d="M4 6h16M4 12h16M4 18h16"/></svg></a>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(div.firstChild, "click", e => { L.DomEvent.preventDefault(e); showPanel(true); });
    return div;
  }
});
const zoomControl = L.control.zoom({ position: "topleft" }).addTo(map);
const panelToggle = new PanelToggle().addTo(map);
L.control.scale({ position: "bottomleft", maxWidth: 120 }).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=" + CARTO_API_KEY, {
  maxZoom: 20, maxNativeZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

let originMarker = null;
let origin = null;                 // {lat, lng}
const overlay = L.layerGroup().addTo(map);
let reqSeq = 0;                    // drops stale responses when inputs change quickly

const qEl = document.getElementById("q");
const resultsEl = document.getElementById("searchResults");
const minsEl = document.getElementById("mins");
const minsOut = document.getElementById("minsOut");

// ---- light hover tips (mouse only; 2 s delay) ----
const tipEl = document.getElementById("tip");
let tipTimer = null, tipX = 0, tipY = 0;
function placeTip() {
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(tipX + 12, innerWidth - w - 6) + "px";
  tipEl.style.top = (tipY + 20 + h > innerHeight ? tipY - h - 8 : tipY + 20) + "px";
}
function tipMove(ev) { tipX = ev.clientX; tipY = ev.clientY; if (tipEl.classList.contains("on")) placeTip(); }
// Safari has no sourceCapabilities, so a tap's emulated mouseover would pop a tip: ignore mouse events right after a touch.
let lastTouch = 0;
addEventListener("touchstart", () => { lastTouch = Date.now(); tipHide(); }, { capture: true, passive: true });
function tipShow(ev, html) {
  if (ev.pointerType === "touch" || (ev.sourceCapabilities && ev.sourceCapabilities.firesTouchEvents)) return;
  if (Date.now() - lastTouch < 1500) return;
  tipMove(ev);
  clearTimeout(tipTimer);
  tipEl.classList.remove("on");   // no stale text from the previous box
  tipTimer = setTimeout(() => { tipEl.innerHTML = html; placeTip(); tipEl.classList.add("on"); }, 2000);
}
function tipHide() { clearTimeout(tipTimer); tipEl.classList.remove("on"); }
function attachTip(el, html) {
  el.addEventListener("mouseenter", e => tipShow(e, html));
  el.addEventListener("mousemove", tipMove);
  el.addEventListener("mouseleave", tipHide);
  el.addEventListener("mousedown", tipHide);
}
function attachLayerTip(layer, html) {
  layer.on("mouseover", e => tipShow(e.originalEvent, html));
  layer.on("mousemove", e => tipMove(e.originalEvent));
  layer.on("mouseout mousedown dragstart", tipHide);
}
attachTip(qEl, "Type an address or landmark, then Enter");
attachTip(minsOut, "Longest walk");   // separately, so moving text <-> slider (e.g. after a drag hid it) re-shows it
attachTip(minsEl, "Longest walk");
attachTip(document.getElementById("closePanel"), "Hide controls");
attachTip(document.getElementById("here"), "Use my current location");
attachTip(panelToggle.getContainer().firstChild, "Show controls");
// zoom buttons: drop Leaflet's native title tooltips, use the same tip box as everything else
[[".leaflet-control-zoom-in", "Zoom in"], [".leaflet-control-zoom-out", "Zoom out"]].forEach(([sel, txt]) => {
  const a = zoomControl.getContainer().querySelector(sel);
  a.removeAttribute("title");
  attachTip(a, txt);
});
// bare map (not over a control, shape or pin): "drag map"
const mapEl = map.getContainer();
let mapTipOn = false;
// The title is pointer-events: none (map cursor + drag pass through), so its tip is found by hit-testing the words.
const TITLE_TIP = "Walking from a given spot for a given amount of time, how far can you get?";
const titleSpans = [...document.querySelectorAll("#title span")];
let titleTipOn = false;
const overTitle = e => titleSpans.some(el => {
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
});
function mapTipUpdate(e) {
  const onTitle = overTitle(e);
  if (onTitle && !titleTipOn) { titleTipOn = true; mapTipOn = false; tipShow(e, TITLE_TIP); return; }
  if (onTitle) return;
  if (titleTipOn) { titleTipOn = false; tipHide(); }
  const bare = !e.target.closest(".leaflet-control, .leaflet-interactive");
  if (bare && !mapTipOn) { mapTipOn = true; tipShow(e, "drag map"); }
  else if (!bare && mapTipOn) {
    mapTipOn = false;
    if (!e.target.closest(".leaflet-interactive")) tipHide();  // shapes/pin set their own tip
  }
}
mapEl.addEventListener("mouseover", mapTipUpdate);
mapEl.addEventListener("mousemove", e => { mapTipUpdate(e); tipMove(e); });
mapEl.addEventListener("mouseleave", () => { mapTipOn = titleTipOn = false; tipHide(); });
mapEl.addEventListener("mousedown", tipHide);

function fmtMins(m) {
  return m + " minutes";
}

// Progress messages ("…") stay until replaced; any other message clears itself.
let statusTimer = null;
function setStatus(msg, isErr) {
  const s = document.getElementById("status");
  clearTimeout(statusTimer);
  s.textContent = msg || "";
  s.className = "status" + (isErr ? " err" : "");
  if (msg && !msg.endsWith("…")) statusTimer = setTimeout(() => setStatus(""), isErr ? 6000 : 4000);
}

// Keep the text field (and pin popup) naming wherever the pin is.
// Without a known label, show coordinates, then the reverse-geocoded address.
let lookupSeq = 0, lastLookup = 0, lookupTimer = null;
function labelPin(lat, lng, label, dragging) {
  const show = text => { qEl.value = text; originMarker.unbindPopup().bindPopup(text); };
  clearTimeout(lookupTimer);
  if (label) { lookupSeq++; return show(label); }      // drop any lookup still in flight
  // while dragging, keep the last address until a newer one arrives
  if (!dragging) show(lat.toFixed(5) + ", " + lng.toFixed(5));
  // reverse lookups at most ~1/s (Nominatim usage policy); the newest one sent wins
  const lookup = () => {
    const seq = ++lookupSeq;
    lastLookup = Date.now();
    fetch(`${NOMINATIM_REVERSE}?lat=${lat}&lon=${lng}&format=jsonv2&zoom=18`)
      .then(r => r.ok ? r.json() : null)
      .then(j => { if (seq === lookupSeq && j && j.display_name) show(j.display_name); })
      .catch(() => {});
  };
  const wait = lastLookup + 1000 - Date.now();
  if (wait > 0) lookupTimer = setTimeout(lookup, wait); else lookup();
}

function setOrigin(lat, lng, label) {
  origin = { lat, lng };
  if (originMarker) originMarker.remove();
  originMarker = L.marker([lat, lng], { draggable: true, autoPan: true }).addTo(map);
  originMarker.on("dblclick", e => { L.DomEvent.stop(e); showPanel(true); });
  attachLayerTip(originMarker, "drag or click to move");
  originMarker.on("drag", e => {
    const p = e.target.getLatLng();
    labelPin(p.lat, p.lng, null, true);
  });
  originMarker.on("dragend", e => {
    const p = e.target.getLatLng();
    origin = { lat: p.lat, lng: p.lng };
    labelPin(p.lat, p.lng);
    computeArea(false);
  });
  resultsEl.innerHTML = "";
  labelPin(lat, lng, label);
  computeArea(true);
}

const panelEl = document.getElementById("panel");
function showPanel(show) {
  panelEl.classList.toggle("hidden", !show);
  panelToggle.getContainer().classList.toggle("hidden", show);
}
document.getElementById("closePanel").onclick = () => showPanel(false);
L.DomEvent.disableClickPropagation(panelEl);
L.DomEvent.disableScrollPropagation(panelEl);

map.on("click", e => setOrigin(e.latlng.lat, e.latlng.lng));

// always "XXX minutes", padded with figure spaces so the slider never shifts
minsEl.oninput = () => minsOut.textContent = String(+minsEl.value).padStart(3, "\u2007") + " minutes";
minsEl.onchange = () => computeArea(false);

// ---- current location ----
document.getElementById("here").onclick = () => {
  if (!navigator.geolocation) return setStatus("This browser can't share your location.", true);
  setStatus("Finding your location…");
  navigator.geolocation.getCurrentPosition(
    pos => {
      resultsEl.innerHTML = "";
      setOrigin(pos.coords.latitude, pos.coords.longitude);
    },
    err => setStatus("Couldn't get your location: " + err.message, true),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
};

// ---- geocoding ----
qEl.addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const query = qEl.value.trim();
  if (!query) return;
  setStatus("Searching…");
  try {
    const r = await fetch(`${NOMINATIM}?q=${encodeURIComponent(query)}&format=jsonv2&limit=6`);
    if (!r.ok) throw new Error(await r.text());
    const hits = await r.json();
    resultsEl.innerHTML = "";
    hits.forEach(h => {
      const li = document.createElement("li");
      li.textContent = h.display_name;
      li.onclick = () => {
        resultsEl.innerHTML = "";
        setOrigin(+h.lat, +h.lon, li.textContent);
      };
      resultsEl.appendChild(li);
    });
    setStatus(hits.length ? "Pick a result." : "No matches.");
  } catch (err) {
    setStatus("Search failed: " + trimErr(err), true);
  }
});

function trimErr(err) {
  const s = String(err.message || err);
  return s.length > 160 ? s.slice(0, 160) + "…" : s;
}

// ---- isochrone (always 3 bands, recomputed whenever origin or time changes) ----
async function computeArea(fit) {
  if (!origin) return;
  const seq = ++reqSeq;
  const totalMin = +minsEl.value;
  const bands = FRACTIONS.map(f => {
    const mins = totalMin * f;
    return { mins, km: +(mins / 60 * WALK_KMH).toFixed(2) };
  });

  setStatus("Computing reachable area…");
  try {
    const req = {
      locations: [{ lat: origin.lat, lon: origin.lng }],
      costing: "pedestrian",
      contours: bands.map(b => ({ distance: b.km })),
      polygons: true
    };
    const r = await fetch(`${VALHALLA}?json=${encodeURIComponent(JSON.stringify(req))}`);
    const gj = await r.json();
    if (seq !== reqSeq) return;
    if (!r.ok || gj.error) throw new Error(gj.error || r.statusText);

    overlay.clearLayers();
    let bounds = null;
    // largest first, so smaller bands sit on top
    const feats = (gj.features || []).slice().sort((a, b) => b.properties.contour - a.properties.contour);
    feats.forEach(f => {
      // match each returned contour to its band by nearest distance
      let i = 0;
      bands.forEach((b, j) => {
        if (Math.abs(b.km - f.properties.contour) < Math.abs(bands[i].km - f.properties.contour)) i = j;
      });
      const color = BAND_COLORS[i];
      const layer = L.geoJSON(f, {
        style: { color, weight: 1, fillColor: color, fillOpacity: 0.2 }
      });
      attachLayerTip(layer, `${fmtMins(Math.round(bands[i].mins))} walk`);
      layer.addTo(overlay);
      bounds = bounds ? bounds.extend(layer.getBounds()) : layer.getBounds();
    });
    if (bounds) {
      if (fit) map.fitBounds(bounds, { padding: [40, 40] });
      setStatus("");
    } else {
      setStatus("No area returned (origin may be off the path network).", true);
    }
  } catch (err) {
    if (seq === reqSeq) setStatus("Request failed: " + trimErr(err), true);
  }
}

// default start: Empire State Building, 30 min walk (slider default)
setOrigin(40.748440, -73.985664, "Empire State Building");
</script>
</body>
</html>
